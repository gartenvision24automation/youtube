services:
  - type: web
    name: gartenvision24-automation
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      # Für jeden Account eine eigene Zeile ergänzen, siehe README:
      # - key: YT_TOKEN_GARTENVISION24
      #   sync: false
